app:
  name: ripple-note
  env: local

http:
  port: 8080
  read_timeout: 5s
  write_timeout: 10s

log:
  level: info

mysql:
  enabled: true
  dsn: "root:dev123456@tcp(127.0.0.1:13306)/ripple_note?charset=utf8mb4&parseTime=True&loc=Local"
  max_open_connections: 20
  max_idle_connections: 10
  connection_max_lifetime: 1h

auth:
  jwt_secret: "local-dev-jwt-secret-change-me"
  jwt_issuer: "ripple-note"
  jwt_ttl: 24h

review:
  internal_token: "local-dev-internal-token"

upload:
  image_dir: "./uploads/images"
  max_image_size: 5242880

redis:
  enabled: true
  addr: "127.0.0.1:6379"
  password: ""
  db: 0
