app:
  name: ripple-note
  env: local

http:
  port: 8080
  read_timeout: 5s
  write_timeout: 10s

log:
  level: info

mysql:
  # Stage 1 keeps MySQL optional so the skeleton and /health can run before Docker Compose exists.
  enabled: false
  dsn: "root:root@tcp(127.0.0.1:3306)/ripple_note?charset=utf8mb4&parseTime=True&loc=Local"
  max_open_connections: 20
  max_idle_connections: 10
  connection_max_lifetime: 1h

auth:
  jwt_secret: "local-dev-jwt-secret-change-me"
  jwt_issuer: "ripple-note"
  jwt_ttl: 24h

review:
  internal_token: "local-dev-internal-token"
